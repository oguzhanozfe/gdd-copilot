name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Demo (no keys, no Ollama -> replay of recorded responses)
        run: |
          python -m gdd_copilot demo --out demo-out
          for d in examples/*/*/recorded; do r=${d%/recorded}; diff demo-out/${r#examples/}/gdd.raw.md $r/gdd.raw.md; done
